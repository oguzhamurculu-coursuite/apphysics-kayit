<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ders Kayıt Sistemi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 780px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 1.5rem; }
  .header img { width: 52px; height: 52px; object-fit: contain; }
  .header-text h1 { font-size: 24px; font-weight: 700; color: #1a1560; line-height: 1.2; }
  .header-text p { font-size: 14px; color: #888; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  @media (min-width: 480px) and (max-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .course { background: #fff; border: 2px solid #1D9E75; border-radius: 16px; padding: 1.2rem 1.3rem; display: flex; flex-direction: column; }
  .course.full { border-color: #e24b4a; opacity: .65; }
  .course-top { display: flex; gap: 5px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .tag-physics { background: #534AB7; color: #fff; }
  .tag-calculus { background: #185FA5; color: #fff; }
  .tag-online { background: #0f6e56; color: #e1f5ee; }
  .tag-full { background: #f09595; color: #791F1F; }
  .course-title { font-size: 15px; font-weight: 600; color: #1a1560; margin-bottom: 5px; line-height: 1.35; }
  .course.full .course-title { color: #aaa; }
  .course-date { font-size: 12px; color: #777; margin-bottom: 12px; }
  .topics { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; flex: 1; }
  .topic { border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 500; }
  .topic-physics { background: #EEEDFE; color: #26215C; }
  .topic-calculus { background: #E6F1FB; color: #042C53; }
  .topic-full { background: #f5f5f5; color: #bbb; }
  .full-banner { background: #fff0f0; border-radius: 8px; padding: 9px; text-align: center; font-size: 13px; color: #e24b4a; font-weight: 500; margin-top: auto; }
  .form-toggle { color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: background .15s; margin-top: auto; }
  .form-toggle-physics { background: #534AB7; }
  .form-toggle-physics:hover { background: #3C3489; }
  .form-toggle-calculus { background: #185FA5; }
  .form-toggle-calculus:hover { background: #0C447C; }
  .register-form { display: none; margin-top: 14px; border-top: 1.5px solid #9FE1CB; padding-top: 14px; }
  .register-form.open { display: block; }
  .section-title { font-size: 11px; font-weight: 600; color: #888; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 10px; }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  .field input { width: 100%; padding: 9px 11px; border: 1.5px solid #9FE1CB; border-radius: 8px; font-size: 14px; outline: none; background: #fff; transition: border-color .15s; }
  .field input:focus { border-color: #1D9E75; }
  .err { font-size: 12px; color: #c0392b; margin-top: 3px; display: none; }
  .submit-btn { width: 100%; padding: 10px; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .submit-btn-physics { background: #534AB7; }
  .submit-btn-physics:hover { background: #3C3489; }
  .submit-btn-calculus { background: #185FA5; }
  .submit-btn-calculus:hover { background: #0C447C; }
  .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
  .success-box { background: #E1F5EE; border: 1px solid #5DCAA5; border-radius: 8px; padding: 12px; text-align: center; margin-top: 10px; }
  .success-box h3 { font-size: 14px; margin-bottom: 3px; color: #085041; }
  .success-box p { font-size: 13px; color: #0F6E56; }
  .loading { text-align: center; padding: 3rem; color: #888; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="/logo.jpeg" alt="Oğuz Aras logo">
    <div class="header-text">
      <h1>Ders Kayıt Sistemi</h1>
      <p>Kayıt olmak istediğiniz dersi seçin.</p>
    </div>
  </div>
  <div class="grid" id="grid">
    <div class="loading" style="grid-column:1/-1">Dersler yükleniyor...</div>
  </div>
</div>

<script>
async function loadCourses() {
  try {
    const res = await fetch('/api/courses');
    const courses = await res.json();
    renderCourses(courses);
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="loading" style="grid-column:1/-1">Yüklenirken hata oluştu.</div>';
  }
}

function renderCourses(courses) {
  const grid = document.getElementById('grid');
  grid.innerHTML = courses.map(c => {
    const topicClass = c.full ? 'topic-full' : `topic-${c.subject}`;
    const dateStr = c.time === 'TBA' ? `${c.date} · Time TBA` : `${c.date} · ${c.time}${c.duration ? ' · ' + c.duration : ''}`;
    const sessionLabel = `${c.date} · ${c.time} · ${c.subject === 'physics' ? 'AP Physics 1' : 'AP Calculus BC'} ${c.title}`;

    if (c.full) {
      return `
        <div class="course full">
          <div class="course-top">
            <span class="tag tag-${c.subject}">${c.subject === 'physics' ? 'AP Physics 1' : 'AP Calculus BC'}</span>
            ${c.online ? '<span class="tag tag-online">Online</span>' : ''}
            <span class="tag tag-full">Dolu</span>
          </div>
          <div class="course-title">${c.title}</div>
          <div class="course-date">${dateStr}</div>
          <div class="topics">${c.topics.map(t => `<div class="topic topic-full">${t}</div>`).join('')}</div>
          <div class="full-banner">Dolu</div>
        </div>`;
    }

    if (!c.active) return '';

    return `
      <div class="course">
        <div class="course-top">
          <span class="tag tag-${c.subject}">${c.subject === 'physics' ? 'AP Physics 1' : 'AP Calculus BC'}</span>
          ${c.online ? '<span class="tag tag-online">Online</span>' : ''}
        </div>
        <div class="course-title">${c.title}</div>
        <div class="course-date">${dateStr}</div>
        <div class="topics">${c.topics.map(t => `<div class="topic topic-${c.subject}">${t}</div>`).join('')}</div>
        <button class="form-toggle form-toggle-${c.subject}" id="toggle-${c.id}" onclick="toggleForm('${c.id}')">Kayıt Ol</button>
        <div class="register-form" id="form-${c.id}">
          <div class="section-title">Kayıt bilgileri</div>
          <div class="field">
            <label>Ad Soyad</label>
            <input type="text" id="${c.id}-name" placeholder="Adınızı girin">
            <div class="err" id="${c.id}-err-name">Bu alan zorunludur.</div>
          </div>
          <div class="field">
            <label>Telefon</label>
            <input type="tel" id="${c.id}-phone" placeholder="05xx xxx xx xx">
            <div class="err" id="${c.id}-err-phone">Geçerli bir numara girin.</div>
          </div>
          <div class="field">
            <label>E-posta <span style="color:#aaa;font-size:12px">(isteğe bağlı)</span></label>
            <input type="email" id="${c.id}-email" placeholder="ornek@mail.com">
          </div>
          <button class="submit-btn submit-btn-${c.subject}" id="${c.id}-submit" onclick="submitForm('${c.id}', '${sessionLabel}')">Kaydımı Tamamla</button>
          <div id="${c.id}-success" class="success-box" style="display:none">
            <h3 id="${c.id}-success-name"></h3>
            <p>${dateStr}</p>
            <p style="margin-top:3px">Görüşmek üzere!</p>
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleForm(id) {
  const form = document.getElementById('form-' + id);
  const btn = document.getElementById('toggle-' + id);
  const isOpen = form.classList.contains('open');
  form.classList.toggle('open', !isOpen);
  btn.textContent = isOpen ? 'Kayıt Ol' : 'Vazgeç';
}

async function submitForm(id, session) {
  const name = document.getElementById(id + '-name').value.trim();
  const phone = document.getElementById(id + '-phone').value.trim();
  const email = document.getElementById(id + '-email').value.trim();
  let ok = true;
  if (!name) { document.getElementById(id + '-err-name').style.display = 'block'; ok = false; }
  else document.getElementById(id + '-err-name').style.display = 'none';
  if (!phone || phone.length < 10) { document.getElementById(id + '-err-phone').style.display = 'block'; ok = false; }
  else document.getElementById(id + '-err-phone').style.display = 'none';
  if (!ok) return;

  const btn = document.getElementById(id + '-submit');
  btn.disabled = true;
  btn.textContent = 'Gönderiliyor...';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, email, session })
    });
    const data = await res.json();
    if (data.success) {
      btn.style.display = 'none';
      document.getElementById(id + '-success-name').textContent = 'Kaydın alındı, ' + name.split(' ')[0] + '!';
      document.getElementById(id + '-success').style.display = 'block';
    } else {
      alert('Bir hata oluştu, lütfen tekrar deneyin.');
      btn.disabled = false;
      btn.textContent = 'Kaydımı Tamamla';
    }
  } catch(e) {
    alert('Bağlantı hatası, lütfen tekrar deneyin.');
    btn.disabled = false;
    btn.textContent = 'Kaydımı Tamamla';
  }
}

loadCourses();
</script>
</body>
</html>
