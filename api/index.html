  .field input:focus { border-color: #7F77DD; }
  .err { font-size: 12px; color: #c0392b; margin-top: 4px; display: none; }
  .session-err { font-size: 12px; color: #c0392b; margin: -12px 0 14px; display: none; }
  .btn { width: 100%; padding: 13px; background: #534AB7; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 4px; }
  .btn:hover { background: #3C3489; }
  .btn:disabled { background: #afa9ec; cursor: not-allowed; }
  .success { display: none; background: #eaf3de; border: 1px solid #97c459; border-radius: 16px; padding: 2rem; text-align: center; margin-top: 1rem; }
  .success h2 { color: #27500a; font-size: 18px; margin-bottom: 8px; }
  .success p { color: #3b6d11; font-size: 14px; }
  .new-btn { margin-top: 14px; padding: 8px 20px; border: 1.5px solid #3b6d11; background: transparent; color: #27500a; border-radius: 10px; cursor: pointer; font-size: 13px; }
</style>
